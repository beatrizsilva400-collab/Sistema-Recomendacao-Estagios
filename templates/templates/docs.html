  <h2>Documentação do Sistema</h2>
  <p>Esta aplicação permite o upload de CVs, processamento e recomendação de empresas de estágio.</p>
  <p>Endpoints disponíveis:</p>
  <ul>
    <li><strong>GET /</strong> — Página inicial</li>
    <li><strong>GET /upload</strong> — Formulário de upload de CV</li>
    <li><strong>POST /api/recomendar</strong> — API para gerar recomendações</li>
  </ul>
</body>
