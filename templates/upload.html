<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Carregar CV</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; text-align: center; padding-top: 50px; }
    form { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, button { margin: 8px; padding: 8px; }
    button { background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <h1>Carregar CV</h1>
  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <label for="file">Escolher ficheiro:</label>
    <input type="file" id="file" name="file" required><br><br>
    <input type="text" name="nome" placeholder="Nome (opcional)">
    <input type="email" name="email" placeholder="Email (opcional)"><br><br>
    <button type="submit">Enviar</button>
  </form>

  <p><a href="{{ url_for('home') }}">Voltar</a></p>
</body>
</html>
